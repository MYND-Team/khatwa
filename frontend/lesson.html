<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحاضرة والدرس | خطوة</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  .security-video-wrapper {
    position: relative;
    background: #050505;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--line-soft);
    user-select: none;
  }
  .dynamic-watermark {
    position: absolute;
    top: 25%;
    left: 25%;
    transform: translate(-50%, -50%);
    color: rgba(255, 255, 255, 0.42);
    font-size: 0.85rem;
    font-weight: 700;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    background: rgba(0, 0, 0, 0.25);
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: top 3s ease-in-out, left 3s ease-in-out;
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="brand"><img src="logo/logo-khatwa.png" alt="خطوة" class="brand-logo"><span class="brand-text">خطوة</span></a>
    <ul class="nav-links">
      <li><a href="dashboard.html">الرئيسية</a></li>
      <li><a href="courses.html">الكورسات والمواد</a></li>
      <li><a href="points.html">النقاط</a></li>
    </ul>
    <div class="nav-cta" style="display:flex;align-items:center;gap:10px;">
      <button class="lang-switcher-btn" onclick="window.KhatwaI18n.toggleLanguage()">🌐 English</button>
      <a href="profile.html" class="user-line" id="navUserLine">
        <span class="avatar" id="navAvatar">ط</span>
        <span>
          <span class="name" id="navName">الطالب</span>
          <span class="role" id="navRole">طالب</span>
        </span>
      </a>
    </div>
  </div>
</nav>

<div class="container" style="padding-top:28px;padding-bottom:60px;max-width:1080px;">

  <!-- Strict Progression Stepper -->
  <div class="progression-stepper" id="progressionStepper">
    <div class="progression-step" id="stepAssignment">
      <div class="progression-step-circle">1</div>
      <span>الخطوة 1: تسليم الواجب</span>
    </div>
    <div class="progression-divider"></div>
    <div class="progression-step" id="stepExam">
      <div class="progression-step-circle">2</div>
      <span>الخطوة 2: اجتياز الامتحان</span>
    </div>
    <div class="progression-divider"></div>
    <div class="progression-step" id="stepLesson">
      <div class="progression-step-circle">3</div>
      <span>الخطوة 3: مشاهدة المحاضرة وPDF</span>
    </div>
  </div>

  <!-- Main Container -->
  <div id="lessonContentContainer">
    <div style="text-align:center;padding:50px;color:var(--ink-dim);">جارٍ فحص صلاحيات الوصول والتسلسل التعليمي...</div>
  </div>

</div>

<!-- Toast notification -->
<div class="toast" id="appToast"></div>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script>
  let lessonId = new URLSearchParams(window.location.search).get('lessonId') || new URLSearchParams(window.location.search).get('id');

  document.addEventListener('DOMContentLoaded', async () => {
    const user = window.KhatwaAPI.getUser();
    if (!user) {
      alert('يرجى تسجيل الدخول للوصول إلى المحاضرة');
      window.location.href = 'login.html';
      return;
    }
    document.getElementById('navName').textContent = user.name || user.username;
    document.getElementById('navAvatar').textContent = (user.name || user.username || 'ط').charAt(0);
    window.KhatwaAPI.syncNav();

    if (!lessonId) {
      document.getElementById('lessonContentContainer').innerHTML = `
        <div style="text-align:center;padding:50px;background:var(--bg-card);border-radius:18px;">
          <h3>لم يتم تحديد رقم المحاضرة</h3>
          <a href="courses.html" class="btn btn-primary btn-sm" style="margin-top:14px;">تصفح الكورسات والمحاضرات</a>
        </div>
      `;
      return;
    }

    await evaluateLessonFlow();
  });

  async function evaluateLessonFlow() {
    const container = document.getElementById('lessonContentContainer');
    const step1 = document.getElementById('stepAssignment');
    const step2 = document.getElementById('stepExam');
    const step3 = document.getElementById('stepLesson');

    try {
      const access = await window.KhatwaAPI.student.checkLessonAccess(lessonId);
      window._latestLessonAccess = access;

      // Derive assignment and exam presence flags (either from backend response contract or derived fallbacks)
      let hasAssignment = typeof access.hasAssignment === 'boolean' 
        ? access.hasAssignment 
        : (access.reason === 'ASSIGNMENT_REQUIRED' || access.step === 'assignment');

      let hasExam = typeof access.hasExam === 'boolean' 
        ? access.hasExam 
        : (access.reason === 'EXAM_REQUIRED' || access.step === 'exam');

      // Adjust stepper: hide steps if teacher did not add homework or exam
      const dividers = document.querySelectorAll('.progression-divider');
      const div1 = dividers[0];
      const div2 = dividers[1];

      if (!hasAssignment) {
        step1.style.display = 'none';
        if (div1) div1.style.display = 'none';
      } else {
        step1.style.display = 'flex';
        if (div1) div1.style.display = 'block';
      }

      if (!hasExam) {
        step2.style.display = 'none';
        if (div2) div2.style.display = 'none';
      } else {
        step2.style.display = 'flex';
        if (div2) div2.style.display = 'block';
      }

      const stepper = document.getElementById('progressionStepper');
      if (!hasAssignment && !hasExam) {
        if (stepper) stepper.style.display = 'none';
      } else {
        if (stepper) stepper.style.display = 'flex';
      }



      // ─── Step 0: Previous Homework Required (Academic Progression Gate) ────
      if (access.reason === 'PREVIOUS_HOMEWORK_REQUIRED') {
        step1.className = 'progression-step active';
        step2.className = 'progression-step';
        step3.className = 'progression-step';

        container.innerHTML = `
          <div class="card" style="padding:36px 24px;border-radius:20px;text-align:center;max-width:560px;margin:0 auto;border:1px solid rgba(245,158,11,0.3);">
            <div style="font-size:3.5rem;margin-bottom:12px;">📝</div>
            <span class="tag tag-warn" style="font-size:0.88rem;font-weight:700;padding:6px 14px;border-radius:999px;">تنبيه نظام خطوة الأكاديمي</span>
            <h2 style="margin:14px 0 8px;font-size:1.4rem;">يجب تسليم واجب الحصة السابقة أولاً</h2>
            <p style="color:var(--ink-dim);line-height:1.7;margin-bottom:20px;">
              لا يمكنك فتح هذه المحاضرة أو دخول امتحانها قبل إكمال وتسليم واجب:
              <br><b style="color:var(--primary);font-size:1.05rem;">${escapeHtml(access.previousLessonTitle || 'المحاضرة السابقة')}</b>
            </p>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
              <a href="lesson.html?lessonId=${access.previousLessonId}" class="btn btn-primary" style="padding:12px 24px;font-weight:700;">
                الذهاب لواجب الحصة السابقة وحله الآن ←
              </a>
              <a href="courses.html" class="btn btn-line btn-sm">العودة لقائمة المواد</a>
            </div>
          </div>
        `;
        return;
      }

      // ─── Step 1: Assignment Required ───────────────────────────────────────
      if (access.reason === 'ASSIGNMENT_REQUIRED') {
        step1.className = 'progression-step active';
        step2.className = 'progression-step';
        step3.className = 'progression-step';

        const quiz = await window.KhatwaAPI.student.getQuiz(access.quizId);
        renderQuizInterface(quiz, 'assignment', 'الواجب المنزلي (يجب التسليم لفتح الامتحان والمحاضرة)');
        return;
      }

      // ─── Step 2: Exam Required ─────────────────────────────────────────────
      if (access.reason === 'EXAM_REQUIRED') {
        step1.className = 'progression-step completed';
        step2.className = 'progression-step active';
        step3.className = 'progression-step';

        const quiz = await window.KhatwaAPI.student.getQuiz(access.quizId);
        renderQuizInterface(quiz, 'exam', 'امتحان المحاضرة (يجب اجتيازه بنجاح لفتح فيديو المحاضرة والـ PDF)');
        return;
      }

      // ─── Lesson Locked (requires individual purchase) ───────────────
      if (access.reason === 'LESSON_LOCKED') {
        step1.className = 'progression-step';
        step2.className = 'progression-step';
        step3.className = 'progression-step active';

        let pointsBalance = 0;
        let walletBalance = 0;
        try {
          const wallet = await window.KhatwaAPI.student.getWallet();
          pointsBalance = wallet.pointsBalance || 0;
          walletBalance = wallet.walletBalance || 0;
        } catch (_) {}

        const priceEGP = Number(access.price) || 0;
        const canAffordWallet = priceEGP > 0 && walletBalance >= priceEGP;

        container.innerHTML = `
          <div class="card" style="padding:32px;border-radius:20px;text-align:center;max-width:540px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,0.15);">
            <div style="font-size:3rem;margin-bottom:10px;">💳</div>
            <h2 style="margin:0 0 8px;font-size:1.45rem;">تفعيل واشتراك المحاضرة</h2>
            <p style="color:var(--ink-dim);margin-bottom:20px;font-size:0.92rem;">اشترك في المحاضرة لمتابعة الشرح والفيديو والمرفقات فوراً:</p>
            
            <div style="background:var(--bg-raised);padding:18px;border-radius:14px;margin-bottom:20px;border:1px solid var(--line-soft);text-align:right;">
              <div style="display:flex;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line-soft);">
                <span>رصيد محفظتك الحالي:</span>
                <strong style="color:var(--primary);font-size:1.05rem;">${walletBalance} ج.م</strong>
              </div>
              <div style="display:flex;justify-content:space-between;">
                <span>سعر المحاضرة:</span>
                <strong style="color:#22c55e;font-size:1.15rem;">${priceEGP} ج.م</strong>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:12px;">
              ${priceEGP > 0 ? `
                <button id="unlockLessonBtnWALLET_EGP" class="btn btn-primary" style="padding:14px;font-size:1rem;justify-content:center;background:#16a34a;border-color:#16a34a;font-weight:700;" ${!canAffordWallet ? 'disabled' : ''} onclick="doPurchaseLesson('WALLET_EGP')">
                  💳 دفع بالجنيه من المحفظة (${priceEGP} ج.م) ${!canAffordWallet ? '— رصيدك لا يكفي' : ''}
                </button>
              ` : ''}

              ${!canAffordWallet ? `
                <div style="margin-top:10px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;">
                  <span style="font-size:0.86rem;color:var(--err);">رصيدك الحالي غير كافٍ.</span>
                  <a href="request-points.html" class="btn btn-line btn-sm">شحن رصيد المحفظة ←</a>
                </div>
              ` : ''}
            </div>
          </div>
        `;
        return;
      }

      // ─── Step 3: All Gates Passed → Render Full Lesson ──────────────────────
      if (access.canAccess || access.reason === 'ALL_CLEAR') {
        step1.className = 'progression-step completed';
        step2.className = 'progression-step completed';
        step3.className = 'progression-step completed active';

        // Video-First Layout: Collapse progression stepper so video player sits at the very top of viewport
        const stepper = document.getElementById('progressionStepper');
        if (stepper) stepper.style.display = 'none';

        const lesson = await window.KhatwaAPI.student.getLessonContent(lessonId);
        renderFullLessonContent(lesson);
        return;
      }

      // Not enrolled
      if (access.reason === 'NOT_ENROLLED') {
        container.innerHTML = `
          <div style="text-align:center;padding:50px;background:var(--bg-card);border-radius:18px;border:1px solid var(--line-soft);">
            <div style="font-size:3rem;margin-bottom:8px;">🔒</div>
            <h3>يجب الاشتراك في الكورس أولاً</h3>
            <p style="color:var(--ink-dim);margin:6px 0 16px;">اشترك في هذا الكورس لتتمكن من متابعة الواجبات، الامتحانات، وفيديوهات المحاضرات.</p>
            <a href="courses.html" class="btn btn-primary">تصفح الكورس والاشتراك</a>
          </div>
        `;
      }
    } catch (err) {
      const stepper = document.getElementById('progressionStepper');
      if (stepper) stepper.style.display = 'none';
      container.innerHTML = `
        <div style="text-align:center;padding:50px;background:var(--bg-card);border-radius:18px;border:1px solid var(--line-soft);max-width:540px;margin:20px auto;">
          <div style="font-size:3rem;margin-bottom:12px;">🔒</div>
          <h3 style="margin-bottom:8px;">المحاضرة غير متاحة</h3>
          <p style="color:var(--ink-dim);margin:6px 0 20px;">هذه المحاضرة غير متاحة أو غير موجودة حالياً.</p>
          <a href="courses.html" class="btn btn-primary">العودة لقائمة المواد</a>
        </div>
      `;
    }
  }

  // Purchase lesson handler — guarded against double-click
  let _unlocking = false;
  async function doPurchaseLesson(paymentMethod) {
    if (_unlocking) return;
    _unlocking = true;
    const btn = document.getElementById('unlockLessonBtn' + paymentMethod);
    if (btn) { btn.disabled = true; btn.textContent = 'جارٍ معالجة الدفع...'; }

    try {
      await window.KhatwaAPI.student.purchaseLesson(lessonId, paymentMethod);
      await evaluateLessonFlow();
    } catch (err) {
      const msg = err.message || 'حدث خطأ';
      if (msg.includes('ALREADY_UNLOCKED') || msg.includes('already') || msg.includes('بالفعل')) {
        await evaluateLessonFlow();
        return;
      }
      alert('فشل تفعيل المحاضرة: ' + msg);
      if (btn) { btn.disabled = false; btn.textContent = 'إعادة المحاولة'; }
    } finally {
      _unlocking = false;
    }
  }

  async function doUnlockLesson(pointCost) {
    return doPurchaseLesson('POINTS');
  }

  function renderQuizInterface(quiz, type, subtitle) {
    const container = document.getElementById('lessonContentContainer');
    const questions = quiz.questions || [];

    container.innerHTML = `
      <div class="card" style="padding:28px;border-radius:20px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <span class="tag ${type === 'assignment' ? 'tag-warn' : 'tag-ok'}">${type === 'assignment' ? 'الخطوة 1: الواجب' : 'الخطوة 2: الامتحان'}</span>
          <h2 style="margin:0;">${quiz.title}</h2>
        </div>
        <p style="color:var(--ink-dim);font-size:0.92rem;margin-bottom:24px;">${subtitle}</p>

        <form id="quizSubmissionForm" onsubmit="submitQuizForm(event, '${quiz.id}')">
          <div style="display:flex;flex-direction:column;gap:20px;">
            ${questions.map((q, idx) => `
              <div style="background:var(--bg-raised);padding:18px;border-radius:14px;border:1px solid var(--line-soft);">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
                  <b>السؤال ${idx + 1}: ${q.questionText}</b>
                  <span class="tag" style="font-size:0.75rem;">${q.questionType}</span>
                </div>

                ${q.equationLatex ? `
                  <div class="math-equation-box">\\[${q.equationLatex}\\]</div>
                ` : ''}

                ${q.questionType === 'MULTIPLE_CHOICE' ? `
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
                    <label style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg-card);border:1px solid var(--line-soft);border-radius:10px;cursor:pointer;">
                      <input type="radio" name="q_${q.id}" value="A" required>
                      <span>أ) ${q.optionA || '—'}</span>
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg-card);border:1px solid var(--line-soft);border-radius:10px;cursor:pointer;">
                      <input type="radio" name="q_${q.id}" value="B" required>
                      <span>ب) ${q.optionB || '—'}</span>
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg-card);border:1px solid var(--line-soft);border-radius:10px;cursor:pointer;">
                      <input type="radio" name="q_${q.id}" value="C" required>
                      <span>ج) ${q.optionC || '—'}</span>
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg-card);border:1px solid var(--line-soft);border-radius:10px;cursor:pointer;">
                      <input type="radio" name="q_${q.id}" value="D" required>
                      <span>د) ${q.optionD || '—'}</span>
                    </label>
                  </div>
                ` : `
                  <div style="margin-top:10px;">
                    <textarea name="q_${q.id}" class="essay-answer-box" placeholder="اكتب إجابتك هنا..." required></textarea>
                  </div>
                `}
              </div>
            `).join('')}
          </div>

          <div style="margin-top:24px;display:flex;justify-content:flex-end;">
            <button type="submit" class="btn btn-primary" id="submitQuizBtn" style="padding:12px 28px;font-size:1rem;">
              تسليم الإجابات ومتابعة الخطوة التالية ✓
            </button>
          </div>
        </form>
      </div>
    `;

    renderLatexMath(container);
  }

  function renderLatexMath(element) {
    if (!element) return;
    if (window.renderMathInElement) {
      try {
        window.renderMathInElement(element, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false },
          ],
          throwOnError: false,
        });
      } catch (err) {
        console.warn('KaTeX render error:', err);
      }
    } else {
      setTimeout(() => renderLatexMath(element), 200);
    }
  }

  async function submitQuizForm(e, quizId) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const answers = [];

    for (let [key, value] of formData.entries()) {
      if (key.startsWith('q_')) {
        const questionId = key.replace('q_', '');
        if (value === 'A' || value === 'B' || value === 'C' || value === 'D') {
          answers.push({ questionId, selectedOption: value });
        } else {
          answers.push({ questionId, textAnswer: value });
        }
      }
    }

    const btn = document.getElementById('submitQuizBtn');
    btn.disabled = true;
    btn.textContent = 'جارٍ التصحيح والتسجيل...';

    try {
      const res = await window.KhatwaAPI.student.submitQuizAttempt(quizId, answers);
      if (res.passed) {
        alert(`أحسنت! تم الاجتياز بنجاح (النتيجة: ${res.score}/${res.totalQuestions}) 🎉 انتقل للخطوة التالية.`);
      } else {
        alert(`تم التسليم (النتيجة: ${res.score}/${res.totalQuestions}).`);
      }
      await evaluateLessonFlow();
    } catch (err) {
      alert(err.message || 'حدث خطأ أثناء تسليم الإجابات');
      btn.disabled = false;
      btn.textContent = 'تسليم الإجابات والمتابعة ✓';
    }
  }

  function renderFullLessonContent(lesson) {
    const user = window.KhatwaAPI.getUser();
    const container = document.getElementById('lessonContentContainer');

    const videoUrl = (lesson.videoUrl || '').trim();
    const ytMatch = videoUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([a-zA-Z0-9_-]{11})/);
    const driveMatch = videoUrl.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)|docs\.google\.com\/file\/d\/)([a-zA-Z0-9_-]+)/);
    const streamSrc = lesson.playbackToken
      ? `${window.KhatwaAPI?.BASE_URL || ''}/student/lessons/${lesson.id}/stream?token=${encodeURIComponent(lesson.playbackToken)}`
      : (lesson.driveFileId ? `${window.KhatwaAPI?.BASE_URL || ''}/student/lessons/${lesson.id}/stream` : null);

    let playerHtml = '';
    if (ytMatch && ytMatch[1]) {
      playerHtml = `
        <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:14px;background:#000;">
          <iframe src="https://www.youtube-nocookie.com/embed/${ytMatch[1]}?rel=0&modestbranding=1&autoplay=0" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        </div>
      `;
    } else if (driveMatch && driveMatch[1]) {
      playerHtml = `
        <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:14px;background:#000;">
          <iframe src="https://drive.google.com/file/d/${driveMatch[1]}/preview" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allow="autoplay" allowfullscreen></iframe>
        </div>
      `;
    } else if (streamSrc) {
      playerHtml = `
        <video controls playsinline controlsList="nodownload" style="width:100%;max-height:540px;display:block;background:#000;border-radius:14px;">
          <source src="${streamSrc}" type="video/mp4">
          متصفحك لا يدعم تشغيل هذا الفيديو.
        </video>
      `;
    } else if (videoUrl) {
      playerHtml = `
        <video controls playsinline controlsList="nodownload" style="width:100%;max-height:540px;display:block;background:#000;border-radius:14px;">
          <source src="${videoUrl}" type="video/mp4">
          متصفحك لا يدعم تشغيل هذا الفيديو.
        </video>
      `;
    } else {
      playerHtml = `
        <div style="padding:80px;text-align:center;color:var(--ink-dim);">
          <div style="font-size:3rem;margin-bottom:10px;">🎬</div>
          <p>فيديو المحاضرة غير متوفر حالياً، يرجى مراجعة المذكرة أدناه.</p>
        </div>
      `;
    }

    const hasGrades = Boolean(lesson.assignmentGrade || lesson.examGrade);
    const gradesHtml = hasGrades ? `
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px;padding:12px 16px;background:var(--bg-raised);border-radius:12px;border:1px solid var(--line-soft);align-items:center;">
        <span style="font-size:0.86rem;font-weight:700;color:var(--ink);">📊 نتائجك في هذه المحاضرة:</span>
        ${lesson.assignmentGrade ? `
          <span class="tag" style="background:rgba(16,185,129,0.14);color:#059669;font-weight:700;padding:5px 12px;border-radius:8px;font-size:0.84rem;">
            📝 الواجب: ${lesson.assignmentGrade.scorePercent}% (${lesson.assignmentGrade.score}/${lesson.assignmentGrade.totalQuestions})
          </span>
          <button type="button" class="btn btn-sm btn-line" onclick="openLessonAttemptReview('${lesson.assignmentQuizId || ''}', 'الواجب المنزلي')" style="font-size:0.82rem;font-weight:700;padding:4px 10px;">👁️ مراجعة إجابات الواجب</button>
        ` : ''}
        ${lesson.examGrade ? `
          <span class="tag" style="background:rgba(99,102,241,0.14);color:#4f46e5;font-weight:700;padding:5px 12px;border-radius:8px;font-size:0.84rem;">
            🎯 الامتحان: ${lesson.examGrade.scorePercent}% (${lesson.examGrade.score}/${lesson.examGrade.totalQuestions})
          </span>
          <button type="button" class="btn btn-sm btn-line" onclick="openLessonAttemptReview('${lesson.examQuizId || ''}', 'امتحان المحاضرة')" style="font-size:0.82rem;font-weight:700;padding:4px 10px;">👁️ مراجعة إجابات الامتحان</button>
        ` : ''}
      </div>
    ` : '';

    container.innerHTML = `
      <div class="card" style="padding:22px;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,0.12);">
        
        <!-- 1. Video-First Priority: The video player container positioned at the very top -->
        <div class="security-video-wrapper" style="margin-bottom:20px;position:relative;overflow:hidden;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.25);background:#000;">
          <div id="videoWatermark" class="dynamic-watermark" style="position:absolute;z-index:20;pointer-events:none;color:rgba(255,255,255,0.4);font-size:0.85rem;font-weight:700;text-shadow:0 0 4px #000;">
            👤 ${user?.name || user?.username || 'Student'} | 🔒 Khatwa Platform
          </div>
          ${playerHtml}
        </div>

        <!-- 2. Secondary Content: All text, details, descriptions, attachments, notes, and comments strictly below video -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:14px;">
          <div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="tag tag-ok" style="font-weight:700;">مكتمل ومتاح ✓</span>
              <span style="font-size:0.85rem;color:var(--ink-dim);">مشاهدة المحاضرة</span>
            </div>
            <h1 style="margin:8px 0 0;font-size:1.65rem;font-weight:800;color:var(--ink);">${escapeHtml(lesson.title)}</h1>
          </div>
          ${lesson.pdfUrl ? `
            <a href="${lesson.pdfUrl}" target="_blank" download="${lesson.pdfFileName || 'lesson-notes.pdf'}" class="btn btn-primary btn-sm" style="padding:10px 18px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;">
              <span>📄 تحميل مذكرة الدرس (PDF)</span>
            </a>
          ` : ''}
        </div>

        ${gradesHtml}

        <!-- Lesson Description & PDF View -->
        <div style="background:var(--bg-raised);padding:22px;border-radius:16px;border:1px solid var(--line-soft);margin-top:16px;">
          <h3 style="margin-top:0;font-size:1.15rem;display:flex;align-items:center;gap:8px;">
            <span>📖 محتوى وشرح المحاضرة:</span>
          </h3>
          <p style="color:var(--ink-dim);line-height:1.75;font-size:0.96rem;margin-bottom:0;">${lesson.description || 'شرح تفصيلي للمفاهيم الأساسية، تطبيقات نموذجية وتدريبات وافية.'}</p>

          ${lesson.pdfUrl ? `
            <div style="margin-top:20px;border-top:1px solid var(--line-soft);padding-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:1.2rem;">📎</span>
                <b>ملف المذكرة المرفق:</b>
                <span style="color:var(--primary);">${lesson.pdfFileName || 'notes.pdf'}</span>
              </div>
              <a href="${lesson.pdfUrl}" target="_blank" class="btn btn-line btn-sm" style="border-radius:10px;">استعراض PDF في نافذة جديدة ↗</a>
            </div>
          ` : ''}
        </div>

        ${(window._latestLessonAccess?.nextLesson || lesson.nextLesson) ? `
          <div style="margin-top:24px;padding:20px 24px;background:linear-gradient(135deg, rgba(37,99,235,0.08), rgba(217,119,6,0.08));border-radius:16px;border:1px solid rgba(217,119,6,0.3);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">
            <div>
              <span style="font-size:0.85rem;color:var(--gold-light);font-weight:700;">المحاضرة التالية في الترتيب:</span>
              <h4 style="margin:4px 0 0;font-size:1.15rem;color:var(--ink);">${escapeHtml((window._latestLessonAccess?.nextLesson || lesson.nextLesson).title)}</h4>
            </div>
            <a href="lesson.html?lessonId=${(window._latestLessonAccess?.nextLesson || lesson.nextLesson).id}" class="btn btn-primary" style="padding:12px 24px;font-size:0.95rem;font-weight:700;border-radius:12px;">
              ▶ الانتقال إلى المحاضرة التالية
            </a>
          </div>
        ` : ''}
      </div>
    `;

    // Move watermark
    const wm = document.getElementById('videoWatermark');
    if (wm) {
      setInterval(() => {
        const top = Math.floor(Math.random() * 60) + 20;
        const left = Math.floor(Math.random() * 60) + 20;
        wm.style.top = `${top}%`;
        wm.style.left = `${left}%`;
      }, 4000);
    }
  }

  // ─── Question Review Modal in Lesson View ──────────────────────────────────
  async function openLessonAttemptReview(quizId, title) {
    if (!quizId) {
      alert('لم يتم العثور على معرّف الاختبار');
      return;
    }

    let modal = document.getElementById('lessonAttemptReviewModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'lessonAttemptReviewModal';
      modal.className = 'modal-backdrop';
      modal.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;align-items:center;justify-content:center;padding:16px;overflow-y:auto;';
      modal.innerHTML = `
        <div style="background:var(--bg-card);border:1px solid var(--line-soft);border-radius:22px;max-width:820px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,0.5);margin:auto;overflow:hidden;">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line-soft);background:var(--bg-raised);">
            <div style="display:flex;align-items:center;gap:12px;">
              <span style="font-size:1.6rem;">📋</span>
              <div>
                <h3 id="lessonModalQuizTitle" style="margin:0;font-size:1.25rem;">مراجعة الإجابات</h3>
                <p id="lessonModalQuizSub" style="margin:4px 0 0;font-size:0.85rem;color:var(--ink-dim);">عرض الصواب والخطأ والحل النموذجي</p>
              </div>
            </div>
            <button onclick="document.getElementById('lessonAttemptReviewModal').style.display='none'" class="btn btn-text" style="font-size:1.4rem;padding:4px 10px;cursor:pointer;">✕</button>
          </div>
          <div id="lessonModalReviewContent" style="padding:24px;overflow-y:auto;flex:1;">
            <div style="text-align:center;padding:40px;color:var(--ink-dim);">جارٍ تحميل الإجابات والحلول...</div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      modal.addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
      });
    }

    const titleEl = document.getElementById('lessonModalQuizTitle');
    const subEl = document.getElementById('lessonModalQuizSub');
    const contentEl = document.getElementById('lessonModalReviewContent');

    titleEl.textContent = `مراجعة إجابات: ${title}`;
    subEl.textContent = 'جاري جلب تفاصيل الإجابات...';
    contentEl.innerHTML = '<div style="text-align:center;padding:50px;color:var(--ink-dim);"><div style="font-size:2rem;margin-bottom:10px;">⏳</div>جارٍ التحميل...</div>';
    modal.style.display = 'flex';

    try {
      const data = await window.KhatwaAPI.student.getQuizAttempt(quizId);
      if (!data) {
        contentEl.innerHTML = '<div style="text-align:center;padding:40px;"><h4>لا توجد تفاصيل متاحة لهذا الاختبار</h4></div>';
        return;
      }

      const answers = data.answers || [];
      const score = data.score !== undefined ? data.score : 0;
      const total = data.totalQuestions || answers.length || 0;
      const pct = total > 0 ? Math.round((score / total) * 100) : 100;
      const passed = data.passed;

      subEl.textContent = `درجتك: ${score} من ${total} (${pct}%) — ${passed ? 'تم الاجتياز بنجاح ✓' : 'لم يتم الاجتياز ✕'}`;

      const optLabels = { A: 'أ', B: 'ب', C: 'ج', D: 'د' };

      let html = `
        <div style="background:var(--bg-raised);padding:14px 18px;border-radius:12px;border:1px solid var(--line-soft);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <span style="font-size:0.85rem;color:var(--ink-dim);">الدرجة المحققة:</span>
            <b style="font-size:1.3rem;color:${passed ? 'var(--ok, #16a34a)' : 'var(--err, #dc2626)'};margin-inline-start:6px;">${score} / ${total}</b>
            <span style="margin-inline-start:6px;font-size:0.9rem;font-weight:700;">(${pct}%)</span>
          </div>
          <span class="tag ${passed ? 'tag-ok' : 'tag-err'}">${passed ? '✓ اجتياز بنجاح' : '✕ لم يتم الاجتياز'}</span>
        </div>
      `;

      if (data.teacherFeedback) {
        html += `
          <div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.3);border-radius:12px;padding:12px 16px;margin-bottom:16px;">
            <b style="color:#d97706;display:block;margin-bottom:4px;">ملاحظات المعلم:</b>
            <p style="margin:0;font-size:0.92rem;">${escapeHtml(data.teacherFeedback)}</p>
          </div>
        `;
      }

      html += `<div style="display:flex;flex-direction:column;gap:16px;">`;

      answers.forEach((ans, idx) => {
        const q = ans.question || {};
        const isEssay = q.questionType === 'ESSAY' || (!ans.selectedOption && Boolean(ans.textAnswer));
        const isOk = ans.isCorrect === true;
        const isPending = ans.isCorrect === null || ans.isCorrect === undefined;
        let borderColor = isOk ? 'rgba(34,197,94,0.4)' : (isPending ? 'rgba(245,158,11,0.4)' : 'rgba(239,68,68,0.4)');

        html += `
          <div style="background:var(--bg-card);border:2px solid ${borderColor};border-radius:14px;padding:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
              <b style="color:var(--primary);">سؤال ${idx + 1}:</b>
              ${isOk ? '<span class="tag tag-ok">✅ إجابة صحيحة</span>' : (isPending ? '<span class="tag tag-warn">⏳ في انتظار التصحيح</span>' : '<span class="tag tag-err">❌ إجابة خاطئة</span>')}
            </div>
            <p style="font-size:1rem;font-weight:600;margin:0 0 12px;line-height:1.6;">${escapeHtml(q.questionText || '')}</p>
            ${q.equationLatex ? `<div style="background:var(--bg-raised);padding:8px 12px;border-radius:8px;margin-bottom:12px;direction:ltr;text-align:center;">$$${escapeHtml(q.equationLatex)}$$</div>` : ''}

            ${!isEssay ? `
              <div style="display:grid;grid-template-columns:1fr;gap:6px;">
                ${['A', 'B', 'C', 'D'].map(letter => {
                  const optText = q['option' + letter];
                  if (!optText) return '';
                  const isSelected = ans.selectedOption === letter;
                  const isCorrectOpt = q.correctOption === letter;

                  let optBg = 'var(--bg-raised)';
                  let optBorder = 'var(--line-soft)';
                  let badge = '';

                  if (isSelected && isCorrectOpt) {
                    optBg = 'rgba(34,197,94,0.12)';
                    optBorder = '#22c55e';
                    badge = '<span style="color:#22c55e;font-weight:700;font-size:0.82rem;margin-inline-start:auto;">✓ إجابتك (صحيحة)</span>';
                  } else if (isSelected && !isCorrectOpt) {
                    optBg = 'rgba(239,68,68,0.12)';
                    optBorder = '#ef4444';
                    badge = '<span style="color:#ef4444;font-weight:700;font-size:0.82rem;margin-inline-start:auto;">✕ إجابتك (خاطئة)</span>';
                  } else if (isCorrectOpt) {
                    optBg = 'rgba(34,197,94,0.12)';
                    optBorder = '#22c55e';
                    badge = '<span style="color:#22c55e;font-weight:700;font-size:0.82rem;margin-inline-start:auto;">★ الإجابة النموذجية الصحيحة</span>';
                  }

                  return `
                    <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:${optBg};border:1.5px solid ${optBorder};font-size:0.92rem;">
                      <span style="font-weight:700;">${optLabels[letter] || letter}</span>
                      <span>${escapeHtml(optText)}</span>
                      ${badge}
                    </div>
                  `;
                }).join('')}
              </div>
            ` : `
              <div style="background:var(--bg-raised);padding:10px;border-radius:8px;margin-bottom:8px;">
                <b style="font-size:0.82rem;color:var(--ink-dim);display:block;margin-bottom:4px;">إجابتك المسلمة:</b>
                <div>${escapeHtml(ans.textAnswer || '—')}</div>
              </div>
              ${q.sampleAnswer ? `
                <div style="background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.25);padding:10px;border-radius:8px;">
                  <b style="font-size:0.82rem;color:#16a34a;display:block;margin-bottom:4px;">نموذج الإجابة الصحيحة:</b>
                  <div>${escapeHtml(q.sampleAnswer)}</div>
                </div>
              ` : ''}
            `}
          </div>
        `;
      });

      html += `</div>`;
      contentEl.innerHTML = html;

      if (window.renderMathInElement) {
        window.renderMathInElement(contentEl, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    } catch (err) {
      contentEl.innerHTML = `<div style="text-align:center;padding:30px;color:var(--err);">فشل تحميل المراجعة: ${escapeHtml(err.message)}</div>`;
    }
  }
</script>
</body>
</html>
