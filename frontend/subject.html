<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الكورس | خطوة</title>
<link rel="icon" type="image/jpeg" href="logo/logo-khatwa.jpeg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="brand"><img src="logo/logo-khatwa.jpeg" alt="خطوة" class="brand-logo"><span class="brand-text">خطوة</span></a>
    <ul class="nav-links">
      <li><a href="dashboard.html">الرئيسية</a></li>
      <li><a href="courses.html" class="active">الكورسات والمواد</a></li>
      <li><a href="points.html">النقاط</a></li>
    </ul>
    <div class="nav-cta">
      <button class="lang-switcher-btn" onclick="window.KhatwaI18n.toggleLanguage()">🌐 English</button>
      <a href="profile.html" class="user-line" id="navUserLine">
        <span class="avatar" id="navAvatar">ط</span>
        <span>
          <span class="name" id="navName">الطالب</span>
          <span class="role" id="navRole">طالب</span>
        </span>
      </a>
    </div>
    <button class="nav-toggle">القائمة</button>
  </div>
</nav>

<div class="app-shell">
  <aside class="sidebar">
    <div class="side-group">
      <h6>الرئيسية</h6>
      <a href="dashboard.html" class="side-link">نظرة عامة</a>
      <a href="courses.html" class="side-link active">الكورسات والمواد</a>
      <a href="results.html" class="side-link">النتائج</a>
    </div>
    <div class="side-group">
      <h6>المحفظة</h6>
      <a href="points.html" class="side-link">رصيد النقاط</a>
      <a href="request-points.html" class="side-link">طلب شحن نقاط</a>
    </div>
    <div class="side-group">
      <h6>الحساب</h6>
      <a href="profile.html" class="side-link">بياناتي</a>
      <a href="#" class="side-link" id="logoutBtn" style="color:var(--err);">تسجيل الخروج</a>
    </div>
  </aside>

  <main class="main">
    <div class="breadcrumb">
      <a href="courses.html">الكورسات</a>
      <span class="sep">›</span>
      <span id="courseBreadcrumbTitle">تفاصيل الكورس</span>
    </div>

    <div class="page-head">
      <div>
        <h1 id="courseHeaderTitle">عنوان الكورس</h1>
        <p class="page-sub" style="margin:6px 0 0;" id="courseHeaderSubtitle">المدرس · المرحلة</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <span class="points-tag" id="coursePointsTag">0 نقطة</span>
        <button id="enrollActionBtn" class="btn btn-primary btn-sm" style="display:none;">اشتراك الآن</button>
      </div>
    </div>

    <div style="max-width:440px;margin-bottom:36px;">
      <div class="progress-label">
        <span>تقدمك في الكورس</span>
        <span id="courseProgressRatio">0 / 0</span>
      </div>
      <div class="progress"><span id="courseProgressBar" style="width:0%;"></span></div>
    </div>

    <div class="block">
      <div class="block-head">
        <h3>محتوى الكورس والمحاضرات</h3>
      </div>

      <div id="lessonsContainer">
        <!-- Dynamically rendered lecture rows -->
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  async function renderCourseDetails() {
    const user = window.KhatwaAPI.getUser();
    let courseId = getQueryParam('id');

    if (user) {
      document.getElementById('navName').textContent = user.name || user.username;
      document.getElementById('navRole').textContent = user.role === 'ADMIN' ? 'مدير عام المنصة' : user.role === 'STAFF' ? 'مشرف' : user.role === 'TEACHER' ? 'مدرس' : 'طالب';
      document.getElementById('navAvatar').textContent = (user.name || user.username || 'ط').charAt(0);
    }

    let course = null;
    if (courseId) {
      course = await window.KhatwaAPI.courses.getById(courseId);
    }

    if (!course) {
      const allCourses = await window.KhatwaAPI.courses.getAll();
      if (allCourses && allCourses.length > 0) {
        course = allCourses[0];
        courseId = course.id;
      }
    }

    if (!course) {
      document.querySelector('.main').innerHTML = `
        <div class="empty-state">
          <div class="em-mark">🔍</div>
          <h3>لم يتم العثور على الكورس المطلوب</h3>
          <p>ربما تم حذفه أو لم يعد متاحًا.</p>
          <a href="courses.html" class="btn btn-primary btn-sm">العودة لقائمة الكورسات</a>
        </div>
      `;
      return;
    }

    const teacherName = course.teacherProfile?.displayName || course.teacherName || 'مدرس المادة';
    const stageLabel = course.academicStage || course.grade || 'المرحلة الدراسية';
    const pointCost = course.pointCost || 0;

    document.title = `${course.title} | خطوة`;
    document.getElementById('courseBreadcrumbTitle').textContent = course.title;
    document.getElementById('courseHeaderTitle').textContent = course.title;
    document.getElementById('courseHeaderSubtitle').textContent = `${teacherName} · ${course.subject} (${stageLabel})`;
    document.getElementById('coursePointsTag').textContent = `${pointCost} نقطة`;

    const isEnrolled = await window.KhatwaAPI.courses.isEnrolled(course.id);
    const enrollBtn = document.getElementById('enrollActionBtn');
    if (!isEnrolled) {
      enrollBtn.style.display = 'inline-flex';
      enrollBtn.textContent = pointCost > 0 ? `اشتراك الان (${pointCost} نقطة)` : 'اشتراك مجاني الآن';
      enrollBtn.onclick = async function() {
        enrollBtn.disabled = true;
        enrollBtn.textContent = 'جارٍ الاشتراك...';
        try {
          await window.KhatwaAPI.courses.enroll(course.id);
          alert('تم الاشتراك في الكورس بنجاح! 🎉');
          await renderCourseDetails();
        } catch (err) {
          alert(err.message || 'فشل الاشتراك في الكورس');
          enrollBtn.disabled = false;
          enrollBtn.textContent = pointCost > 0 ? `اشتراك الآن (${pointCost} نقطة)` : 'اشتراك مجاني الآن';
        }
      };
    } else {
      enrollBtn.style.display = 'none';
    }

    // Flatten chapters & lessons
    let allLessons = [];
    if (course.chapters && Array.isArray(course.chapters)) {
      course.chapters.forEach(ch => {
        if (ch.lessons && Array.isArray(ch.lessons)) {
          allLessons.push(...ch.lessons);
        }
      });
    } else if (course.lessons && Array.isArray(course.lessons)) {
      allLessons = course.lessons;
    }

    const totalCount = allLessons.length;
    document.getElementById('courseProgressRatio').textContent = `${isEnrolled ? totalCount : 0} من ${totalCount} حصة متاحة`;
    document.getElementById('courseProgressBar').style.width = isEnrolled ? '100%' : '0%';

    const container = document.getElementById('lessonsContainer');
    if (totalCount === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="em-mark">⏳</div>
          <h3>المدرس لم يرفع محاضرات في هذا الكورس بعد</h3>
          <p>سيتم رفع المحاضرات والفيديوهات ومواد الشرح قريبًا.</p>
        </div>
      `;
    } else {
      container.innerHTML = allLessons.map((lec, idx) => {
        const isAvailable = isEnrolled;
        const lessonCost = lec.pointCost || 0;
        return `
          <div class="lesson-row ${!isAvailable ? 'locked' : ''}">
            <span class="lnum">${idx + 1}</span>
            <div class="ltext">
              <b>${escapeHtml(lec.title)}</b>
              <span>${escapeHtml(lec.description || 'محاضرة وشرح تفصيلي للمنهج')}</span>
            </div>
            ${isAvailable ? `
              <div style="display:flex;align-items:center;gap:8px;">
                ${lessonCost > 0 ? `<span class="tag tag-warn">💎 ${lessonCost} نقطة</span>` : '<span class="tag tag-ok">مجاني</span>'}
                <a href="lesson.html?courseId=${course.id}&lessonId=${lec.id}" class="btn btn-primary btn-sm">ابدأ المحاضرة</a>
              </div>
            ` : `
              <span class="tag tag-locked">اشترك لفتح الدرس 🔒</span>
            `}
          </div>
        `;
      }).join('');
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
    e.preventDefault();
    window.KhatwaAPI.auth.logout();
  });

  document.addEventListener('DOMContentLoaded', renderCourseDetails);
</script>
<script src="js/i18n.js"></script>
</body>
</html>
