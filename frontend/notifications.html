          <span class="role" id="navRole">طالب</span>

  <aside class="sidebar">

      <!-- Rendered dynamically -->
    </div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  function renderNotifications() {
    const user = window.KhatwaAPI.getUser();
    if (!user) {
      window.location.href = 'login.html';
      return;
    }

    const activities = window.KhatwaAPI.student.getActivities();
    const container = document.getElementById('notifListContainer');

    if (!activities || activities.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="padding:32px 16px;text-align:center;color:var(--ink-dim);">
          <div style="font-size:1.8rem;margin-bottom:8px;">🔔</div>
          <p style="margin:0;font-weight:600;">لا توجد إشعارات جديدة حالياً</p>
          <span style="font-size:.82rem;color:var(--ink-faint);">ستصلك تنبيهات عند نشر حصص جديدة، أو تسجيل نتائجك.</span>
        </div>
      `;
    } else {
      container.innerHTML = activities.map(a => {
        const timeStr = a.timestamp ? new Date(a.timestamp).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
        return `
          <div class="notif-item">
            <div class="ntext">
              <b>${escapeHtml(a.text)}</b>
              <span>إشعار تلقائي من نظام منصة خطوة</span>
            </div>
            <time>${timeStr}</time>
          </div>
        `;
      }).join('');
    }

    document.getElementById('markAllReadBtn')?.addEventListener('click', () => {
      document.querySelectorAll('.notif-item').forEach(n => n.classList.remove('unread'));
    });

    window.KhatwaAPI.syncNav();
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.addEventListener('DOMContentLoaded', renderNotifications);
</script>
</body>
</html>
